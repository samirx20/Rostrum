[workspace]
resolver = "3"
members = ["render", "color", "stamp"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

# Agents' working builds: `cargo build --profile agent -j 4`, output in target/agent/. Our crates build
# incrementally in many small units; dependencies (Skia, Stylo, ...) stay fully optimised. Releases use `release`.
[profile.agent]
inherits = "release"
opt-level = 2
incremental = true
codegen-units = 256
debug = 0

[profile.agent.package."*"]
opt-level = 3
codegen-units = 16

# Our fork of Blitz, AnyRender, Parley and usvg (MIT / Apache-2.0, licences kept). What each patch fixes is
# in vendor/PATCHES.md. Only these exact versions are patched.
[patch.crates-io]
usvg = { path = "vendor/usvg" }
blitz-paint = { path = "vendor/blitz-paint" }
blitz-dom = { path = "vendor/blitz-dom" }
anyrender_skia = { path = "vendor/anyrender_skia" }
anyrender = { path = "vendor/anyrender" }
parley = { path = "vendor/parley" }
