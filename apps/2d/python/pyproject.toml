[project]
name = "rostrum2d"
version = "0.1.0"
description = "Rostrum2D's Python layer: document, operations, script layer, engine contract, MCP server"
requires-python = ">=3.11"
dependencies = ["rostrum_core"]

[project.optional-dependencies]
mcp = ["rostrum_core[mcp]"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum2d*"]
