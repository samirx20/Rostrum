[project]
name = "rostrum2d"
version = "0.1.0"
description = "Rostrum2D's Python layer: document, operations, script layer, engine contract, MCP server"
requires-python = ">=3.11"
dependencies = ["rostrum_core", "skia-pathops>=0.9",   # skia-pathops: path booleans (BSD-3-Clause)
                "rostrum-sound", "soundfile>=0.12"]   # 2D plays / writes the project's sound through Sound's engine (rule 9); soundfile BSD-3

[project.optional-dependencies]
mcp = ["rostrum_core[mcp]"]
io = ["pypdfium2>=4", "pypdf>=5", "psd-tools>=1.9", "pillow", "numpy", "fonttools>=4.40", "uharfbuzz>=0.40", "OpenEXR>=3.3"]   # file import / export: Apache-2.0 / BSD-3, BSD-3 (pypdf: PDF shadings + clips), MIT, MIT-CMU, BSD-3, MIT, Apache-2.0 (uharfbuzz: Lottie text shaping); EXR read-back: BSD-3
lipsync = ["rostrum_core[lipsync]"]                                   # LIPSYNC.md: numpy, scipy, soundfile, onnxruntime (shared core)
render3d = ["numpy", "pillow", "OpenEXR>=3.3", "opencolorio>=2.5,<2.6"]   # 3D render layers (render3d.py): BSD-3, MIT-CMU, BSD-3, BSD-3 (OCIO pinned to the 3D core's 2.5)
test = ["pytest", "rostrum2d[io,render3d]"]

[project.scripts]
rostrum-2d-mcp = "rostrum2d.mcp.server:main"

[project.entry-points."rostrum.links"]           # a shared marker following a 2D layer (rostrum_core.links)
2d = "rostrum2d.links2d:time_of"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum2d*"]

[tool.uv.sources]                                # our own packages come from this checkout, never from an index
rostrum-core = { path = "../../../shared/core", editable = true }
rostrum-sound = { path = "../../sound/python", editable = true }
