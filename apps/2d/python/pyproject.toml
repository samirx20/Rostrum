[project]
name = "rostrum2d"
version = "0.1.0"
description = "Rostrum2D's Python layer: document, operations, script layer, engine contract, MCP server"
requires-python = ">=3.11"
dependencies = ["rostrum_core", "skia-pathops>=0.9"]   # skia-pathops: path booleans (BSD-3-Clause)

[project.optional-dependencies]
mcp = ["rostrum_core[mcp]"]
io = ["pypdfium2>=4", "pypdf>=5", "psd-tools>=1.9", "pillow", "numpy", "fonttools>=4.40", "uharfbuzz>=0.40"]   # file import / export: Apache-2.0 / BSD-3, BSD-3 (pypdf: PDF shadings + clips), MIT, MIT-CMU, BSD-3, MIT, Apache-2.0 (uharfbuzz: Lottie text shaping)
lipsync = ["numpy", "scipy", "soundfile",                                  # LIPSYNC.md (all BSD-3)
           "onnxruntime-directml>=1.24; sys_platform == 'win32'",           # MIT
           "onnxruntime>=1.24; sys_platform != 'win32'"]                    # MIT
test = ["pytest", "rostrum2d[io]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum2d*"]
