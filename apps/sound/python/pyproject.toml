[project]
name = "rostrum-sound"
version = "0.1.0"
description = "RostrumSound's Python layer: the Sound document, its script layer, the engine schedule, listening tools."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["rostrum-core"]

[project.optional-dependencies]
# What ships: the ears' maths is our own numpy (listen/dsp*.py, bs1770.py); matplotlib draws the pictures.
# OpenCV (video looks) is downloaded on first use: python -m rostrum_sound.sfx.opencv.
listen = ["numpy", "soundfile", "matplotlib"]
# Development only: the libraries the numpy versions were checked against, and OpenCV for the video looks in a dev venv.
listen-dev = ["librosa", "scipy", "pyloudnorm", "opencv-python-headless==5.0.0.93"]
mcp = ["rostrum-core[mcp]"]
cleanup = ["numpy", "soundfile", "onnxruntime-directml; sys_platform == 'win32'", "onnxruntime; sys_platform != 'win32'"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum_sound*"]

[project.scripts]
rostrum-sound-mcp = "rostrum_sound.mcp.server:main"

[tool.setuptools.package-data]
rostrum_sound = ["library_data/*.json"]          # guides: apps/sound/guides/ (read from the source tree, like 2D skills/)

[tool.pytest.ini_options]
testpaths = ["tests"]
