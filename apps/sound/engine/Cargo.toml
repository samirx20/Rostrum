[package]
name = "rostrum-sound"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RostrumSound's engine: renders a schedule (ENGINE_CONTRACT.md) offline, plays it live, hosts CLAP / VST3."

[dependencies]
firewheel = { version = "0.14", default-features = false, features = ["std", "cpal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "params", "state", "audio-ports", "note-ports", "render", "log", "gui", "preset-discovery"] }
vst3 = "0.3"
# The inspection's spectrogram (MIT OR Apache-2.0; already in the workspace through the Motion renderer).
png = "0.18"
# The per-track render cache's keys (trackcache.rs; CC0 / Apache-2.0; already in the workspace).
blake3 = "1.8"
# FLAC samples in SFZ instruments (flac.rs; Apache-2.0, pure Rust, no dependencies).
claxon = "0.4"
rubato = "5.0.1"
rustfft = "6.4.1"
realfft = "3.5.0"
ebur128 = "0.1.10"
freeverb = "0.2.0"
audioadapter-buffers = "5.2.0"
# The engine decodes media itself (contract/media.rs; MPL-2.0, pure Rust): WAV, FLAC, Vorbis, MP3, AAC in MP4 / MOV.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "ogg", "vorbis", "mp3", "isomp4", "aac"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

# The engine is its own workspace (its own Cargo.lock and target folder under apps/sound/engine/).
[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

# Working builds: `cargo build --profile agent -j 4` (target/agent/). Our crate builds incrementally in small units;
# dependencies stay fully optimised. Releases use `release`.
[profile.agent]
inherits = "release"
opt-level = 2
incremental = true
codegen-units = 256
debug = 0

[profile.agent.package."*"]
opt-level = 3
codegen-units = 16

# Rostrum's patched rustysynth (MIT): velocity and attenuation as the SoundFont spec has them; see vendor/PATCHES.md.
[patch.crates-io]
rustysynth = { path = "vendor/rustysynth" }
