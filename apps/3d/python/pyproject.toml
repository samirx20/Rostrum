[project]
name = "rostrum3d"
version = "0.1.0"
description = "Rostrum3D's Python layer: document, operations, script layer, scene compiler, engine client, MCP server"
requires-python = ">=3.11"
dependencies = ["rostrum_core", "rostrum2d", "Pillow>=10.1"]   # rostrum2d: the one easing table and key evaluator (until they move to rostrum_core)

[project.scripts]
rostrum-3d = "rostrum3d.mcp.server:main"

[project.optional-dependencies]
mcp = ["rostrum_core[mcp]"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum3d*"]

[tool.setuptools.package-data]
rostrum3d = ["guides/*.md"]
