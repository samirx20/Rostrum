[project]
name = "rostrum-paint"
version = "0.1.0"
description = "Rostrum's shared painting kit: one brush engine and painting tools for people and agents."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["rostrum-core", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostrum_paint*"]

